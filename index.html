<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ruta de cobro</title>
  <meta name="description" content="Cartera de clientes y cobros, disponible sin internet.">
  <meta name="theme-color" content="#15202B">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./assets/icons/icon-192.png">
  <link rel="apple-touch-icon" href="./assets/icons/icon-192.png">
  <link rel="stylesheet" href="./css/styles.css">
</head>
<body>
  <header class="barra-superior">
    <h1 id="titulo-vista">Clientes</h1>
    <span id="indicador-red" class="chip-red" hidden>Sin conexión</span>
  </header>

  <main id="vista" class="vista" tabindex="-1"></main>

  <nav class="barra-inferior barra-cuatro" aria-label="Secciones">
    <a href="#/ruta" data-nav="ruta">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s7-5.5 7-11a7 7 0 1 0-14 0c0 5.5 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>
      Hoy
    </a>
    <a href="#/clientes" data-nav="clientes">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
      Clientes
    </a>
    <a href="#/cliente/nuevo" data-nav="nuevo">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      Nuevo
    </a>
    <a href="#/importar" data-nav="importar">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V4M7 9l5-5 5 5M4 19h16"/></svg>
      Importar
    </a>
  </nav>

  <div id="avisos" class="avisos" role="status" aria-live="polite"></div>

  <!-- ====== DIAGNÓSTICO ======
       Script clásico: se ejecuta aunque los módulos fallen.
       Si la app arranca bien, esto nunca se ve.
       Puedes borrar todo este bloque cuando ya funcione. -->
  <script>
  (function () {
    var vista = document.getElementById('vista');
    var ARCHIVOS = [
      './js/app.js',
      './js/db/database.js',
      './js/db/clientes.repo.js',
      './js/services/csv.service.js',
      './js/services/importacion.service.js',
      './js/views/clientes.view.js',
      './js/views/cliente-form.view.js',
      './js/views/importar.view.js',
      './js/utils/dom.js',
      './js/utils/validadores.js',
      './css/styles.css'
    ];

    var ultimoError = '';

    window.addEventListener('error', function (evento) {
      if (evento.target && evento.target.src) ultimoError = 'No cargó: ' + evento.target.src;
      else ultimoError = evento.message || 'Error de JavaScript';
    }, true);

    window.addEventListener('unhandledrejection', function (evento) {
      var razon = evento.reason;
      ultimoError = (razon && razon.message) || String(razon);
    });

    function pintar(titulo, lineas) {
      var html = '<div style="padding:16px;font-size:14px;line-height:1.6">' +
        '<p style="font-weight:700;font-size:16px;margin:0 0 4px">' + titulo + '</p>' +
        '<p style="margin:0 0 12px;color:#5A6B7B">' + location.href + '</p>';
      for (var i = 0; i < lineas.length; i++) {
        html += '<div style="word-break:break-all;font-family:ui-monospace,monospace;font-size:12.5px;padding:3px 0;border-bottom:1px solid #CFD8E0">' + lineas[i] + '</div>';
      }
      html += '</div>';
      vista.innerHTML = html;
    }

    function revisar() {
      var lineas = [];
      if (ultimoError) lineas.push('⚠ ' + ultimoError);
      if (location.protocol === 'file:') {
        lineas.push('⚠ Abierto como file:// — los módulos solo cargan por HTTP.');
      }

      var pendientes = ARCHIVOS.length;

      ARCHIVOS.forEach(function (ruta, indice) {
        fetch(ruta, { cache: 'no-store' })
          .then(function (respuesta) {
            var tipo = (respuesta.headers.get('content-type') || 'sin tipo').split(';')[0];
            var esperado = ruta.indexOf('.css') > -1 ? 'css' : 'javascript';
            var bien = respuesta.ok && tipo.indexOf(esperado) > -1;
            lineas[indice + 100] = (bien ? '✓ ' : '✗ ') + ruta + '  →  ' + respuesta.status + '  ' + tipo;
          })
          .catch(function (error) {
            lineas[indice + 100] = '✗ ' + ruta + '  →  ' + error.message;
          })
          .then(function () {
            pendientes--;
            if (pendientes === 0) {
              pintar('La app no arrancó', lineas.filter(function (linea) { return !!linea; }));
            }
          });
      });
    }

    setTimeout(function () {
      if (!window.__appLista) revisar();
    }, 2500);
  })();
  </script>

  <script src="./js/diagnostico.js"></script>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
